name: publish

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install build and test tooling
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"

      - name: Build distributions
        run: python -m build

      - name: Run repository checks
        run: make check

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  install-wheel-only:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install wheel with wheel-only dependency resolution
        shell: bash
        env:
          PIP_ONLY_BINARY: ":all:"
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install dist/simpledet-*.whl
          python -m pip install "simpledet[cpu]"

      - name: Verify installed package
        shell: bash
        run: |
          python -m simpledet --version
          python -m simpledet --check-runtime

  publish-pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - install-wheel-only
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
