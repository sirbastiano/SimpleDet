<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="training workflow">
  <rect width="900" height="420" fill="#0a142b"/>
  <rect x="12" y="12" width="876" height="396" rx="14" fill="#0e1c3f" stroke="#8d95bb"/>
  <rect x="34" y="30" width="832" height="80" fill="#141f46"/>
  <text x="52" y="62" fill="#e9f1ff" font-family="monospace" font-size="18">$ python -m simpledet --version</text>
  <text x="52" y="90" fill="#9de5ff" font-family="monospace" font-size="14">0.1.0</text>
  <rect x="34" y="130" width="832" height="120" fill="#111d42"/>
  <text x="52" y="160" fill="#e9f1ff" font-family="monospace" font-size="18">$ python runscripts/SenTrainer.py --batch_size 2 ... --max_epochs 1</text>
  <text x="52" y="192" fill="#8dffd1" font-family="monospace" font-size="14">Epoch 1/1 | loss=1.24 | lr=1e-3 | seed=71</text>
  <text x="52" y="220" fill="#8dffd1" font-family="monospace" font-size="14">Training completed. checkpoint: results/native_smoke/epoch_001.pth</text>
  <g>
    <rect x="520" y="286" width="320" height="90" rx="12" fill="#16224f"/>
    <text x="548" y="322" fill="#fff4c0" font-family="monospace" font-size="15">results/native_smoke/</text>
    <text x="548" y="348" fill="#fff4c0" font-family="monospace" font-size="15">epoch_001.pth  metrics.json</text>
  </g>
  <rect x="56" y="302" width="420" height="52" fill="#213066"/>
  <rect x="56" y="302" width="120" height="52" fill="#5bc7ff">
    <animate attributeName="width" values="40;360;40" dur="4s" repeatCount="indefinite" />
  </rect>
  <text x="56" y="336" fill="#0d193d" font-family="monospace" font-size="14">Progress</text>
</svg>
