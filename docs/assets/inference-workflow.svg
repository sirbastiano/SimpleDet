<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="inference workflow">
  <rect width="900" height="420" fill="#100c1f"/>
  <rect x="12" y="12" width="876" height="396" rx="14" fill="#19102f" stroke="#a58eff"/>
  <text x="38" y="56" fill="#f0ebff" font-family="monospace" font-size="18">$ python - &lt;&lt;'PY'
</text>
  <text x="38" y="84" fill="#9ce7ff" font-family="monospace" font-size="14">from simpledet.detectors.infer import load_model, predict</text>
  <text x="38" y="108" fill="#9ce7ff" font-family="monospace" font-size="14">model = load_model('results/native_smoke/epoch_001.pth')</text>
  <text x="38" y="132" fill="#9ce7ff" font-family="monospace" font-size="14">res = predict('sample.tif', model=model)</text>
  <text x="38" y="168" fill="#c7f6ff" font-family="monospace" font-size="14">print(res["scores"][:3], res["class_ids"][:3])</text>
  <rect x="40" y="196" width="810" height="120" rx="12" fill="#24163b"/>
  <text x="58" y="228" fill="#f7f0ff" font-family="monospace" font-size="14">[0.94, 0.88, 0.76], [1, 1, 3], [[14.2, 19.1, 74.8, 88.3], ...]</text>
  <rect x="40" y="330" width="810" height="52" rx="12" fill="#31204f"/>
  <text x="58" y="364" fill="#b9f1ff" font-family="monospace" font-size="14">Inference complete: batch_size=1 | max_detections=128 | score_threshold=0.2</text>
  <circle cx="780" cy="95" r="9" fill="#ff9ce0">
    <animate attributeName="r" values="9;12;9" dur="1.2s" repeatCount="indefinite" />
  </circle>
</svg>
